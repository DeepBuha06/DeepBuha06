    </g>

    <g class="line line-8">
      <text class="text-dim" y="282">  └──</text>
      <text class="text-purple" x="50" y="282"> Tools     </text>
      <text class="text-dim" x="152" y="282">→</text>
      <text class="text-cyan" x="162" y="282">Git</text>
      <text class="text-dim" x="200" y="282">│</text>
      <text class="text-cyan" x="212" y="282">Docker</text>
      <text class="text-dim" x="275" y="282">│</text>
      <text class="text-cyan" x="287" y="282">Linux</text>
      <text class="text-dim" x="340" y="282">│</text>
      <text class="text-cyan" x="352" y="282">Performance Profiling</text>
    </g>

    <!-- Line 9: Loading projects bar -->
    <g class="line line-9">
      <text class="text-dim" y="310">[load]</text>
      <text class="text-white" x="56" y="310"> Mounting project repos...</text>
      <rect x="268" y="300" width="184" height="14" rx="3" fill="none" stroke="#1e3a5f" stroke-width="1"/>
      <rect class="load-bar-fill-2" x="270" y="302" height="10" rx="2" fill="#e879f9"/>
      <text class="tag-loaded" x="460" y="311">[LOADED]</text>
    </g>

    <!-- Line 10-14: Projects (original repos) -->
    <g class="line line-10">
      <text class="text-dim" y="334">  ├──</text>
      <text class="text-cyan" x="50" y="334">on-heap-off-heap-benchmark</text>
      <text class="text-dim" x="265" y="334">│</text>
      <text class="text-white" x="278" y="334">Java memory benchmark</text>
    </g>

    <g class="line line-11">
      <text class="text-dim" y="354">  ├──</text>
      <text class="text-cyan" x="50" y="354">CS-299</text>
      <text class="text-dim" x="105" y="354">│</text>
      <text class="text-white" x="118" y="354">Attention is Not Explanation</text>
    </g>

    <g class="line line-12">
      <text class="text-dim" y="374">  └──</text>
      <text class="text-cyan" x="50" y="374">cpu-cache-mechanics</text>
      <text class="text-dim" x="205" y="374">│</text>
      <text class="text-white" x="218" y="374">Low-level C++ architectures &amp; edge cases</text>
    </g>

    <!-- Line 13-14: Portfolio -->
    <g class="line line-13">
      <text class="text-dim" y="398">[link]</text>
      <text class="text-white" x="56" y="398"> Deploying portfolio interface...</text>
      <text class="tag-ready" x="330" y="399">[ONLINE]</text>
    </g>

    <g class="line line-14">
      <text class="text-dim" y="418">  →</text>
      <text class="text-cyan" x="40" y="418">DeepBuha06.github.io</text>
      <text class="text-dim" x="215" y="418">│</text>
      <text class="text-white" x="228" y="418">https://deepbuha06.github.io</text>
    </g>

    <!-- Line 15: Status loading -->
    <g class="line line-15">
      <text class="text-dim" y="442">[stat]</text>
      <text class="text-white" x="56" y="442"> Computing GitHub metrics...</text>
      <rect x="290" y="432" width="184" height="14" rx="3" fill="none" stroke="#1e3a5f" stroke-width="1"/>
      <rect class="load-bar-fill-3" x="292" y="434" height="10" rx="2" fill="#4ade80"/>
      <text class="tag-ready" x="482" y="443">[READY]</text>
    </g>

    <!-- Line 16: Stats -->
    <g class="line line-16">
      <text class="text-dim" y="466">  →</text>
      <text class="text-green" x="30" y="466"> 28 repos</text>
      <text class="text-dim" x="120" y="466">│</text>
      <text class="text-magenta" x="132" y="466"> Open Source Contributor</text>
    </g>

    <!-- Line 17: Final ready -->
    <g class="line line-17">
      <text class="text-dim" y="492">[done]</text>
      <text class="text-green" x="56" y="492"> All systems nominal. Welcome to the matrix, Deep.</text>
      <text class="tag-ok" x="530" y="492">[ONLINE]</text>
    </g>

    <!-- Line 18: Prompt with blinking cursor -->
    <g class="line line-18">
      <text class="prompt" y="516">deep@cyberspace:~$</text>
      <rect class="final-cursor" x="170" y="504" width="10" height="14" fill="#22d3ee"/>
    </g>
