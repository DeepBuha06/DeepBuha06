      <text class="text-green" x="442" y="222">Bash</text>
    </g>

    <g class="line line-6">
      <text class="text-dim" y="242">  ├──</text>
      <text class="text-purple" x="50" y="242"> Frameworks</text>
      <text class="text-dim" x="152" y="242">→</text>
      <text class="text-magenta" x="162" y="242">PyTorch</text>
      <text class="text-dim" x="230" y="242">│</text>
